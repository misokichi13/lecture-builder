<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>講義・セミナー構成作成＆マルチペルソナ検証ツール</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 p-4 md:p-8">

  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- ヘッダー & APIキー設定 -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">講義・セミナー構成作成ツール</h1>
        <p class="text-sm text-slate-500">マルチペルソナ検証 & ナレッジ継承システム</p>
      </div>
      <div class="flex items-center gap-2 w-full md:w-auto">
        <input type="password" id="apiKey" placeholder="Gemini API Key を入力" class="border p-2 rounded text-sm w-full md:w-64">
        <button onclick="saveApiKey()" class="bg-slate-800 text-white px-4 py-2 rounded text-sm whitespace-nowrap hover:bg-slate-700">保存</button>
      </div>
    </header>

    <!-- 入力フォーム & JSON保存・読み込み -->
    <div class="grid md:grid-cols-3 gap-6">
      
      <!-- 入力・コントロールパネル -->
      <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 md:col-span-1 space-y-4">
        <div class="flex justify-between items-center border-b pb-2">
          <h2 class="font-bold text-slate-700">1. 基本条件の入力</h2>
          <div class="space-x-1">
            <button onclick="exportData()" class="text-xs bg-emerald-100 text-emerald-800 px-2 py-1 rounded hover:bg-emerald-200">JSON保存</button>
            <label class="text-xs bg-sky-100 text-sky-800 px-2 py-1 rounded hover:bg-sky-200 cursor-pointer">
              JSON読込 <input type="file" id="importFile" onchange="importData(event)" class="hidden" accept=".json">
            </label>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold mb-1">テーマ・タイトル</label>
          <input type="text" id="theme" class="w-full border p-2 rounded text-sm" placeholder="例: 職場のアンコンシャス・バイアス研修">
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1">対象者（ペルソナ）</label>
          <input type="text" id="target" class="w-full border p-2 rounded text-sm" placeholder="例: 30〜40代の中堅社員・管理職候補">
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1">所要時間</label>
          <input type="text" id="duration" class="w-full border p-2 rounded text-sm" placeholder="例: 90分（講義60分＋ワーク30分）">
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1">ゴール（到達目標）</label>
          <textarea id="goal" class="w-full border p-2 rounded text-sm h-20" placeholder="例: 無意識の偏見に気づき、明日からのコミュニケーションで意識すべき1つの行動を決める"></textarea>
        </div>

        <button onclick="generateProposal()" id="generateBtn" class="w-full bg-indigo-600 text-white py-2.5 rounded font-bold hover:bg-indigo-700">
          多角分析＆構成案を一括生成
        </button>
      </section>

      <!-- 結果表示エリア -->
      <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 md:col-span-2 space-y-6">
        <h2 class="font-bold text-slate-700 border-b pb-2">2. ペルソナ分析 & 統合構成案</h2>

        <!-- ペルソナ別分析出力 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="personaOutput">
          <!-- JSでペルソナごとのカードが生成されます -->
        </div>

        <!-- 統合された70%構成案 -->
        <div class="bg-slate-50 p-4 rounded-lg border border-slate-200">
          <h3 class="font-bold text-indigo-900 mb-2">【統合構成案（70%完成版）】</h3>
          <div id="finalProposal" class="whitespace-pre-wrap text-sm text-slate-700">ここに生成結果が表示されます。</div>
        </div>

        <!-- 深掘りチャット -->
        <div class="border-t pt-4 space-y-3">
          <h3 class="font-bold text-slate-700 text-sm">3. 継続対話（構成案の修正・深掘り）</h3>
          <div id="chatHistory" class="max-h-40 overflow-y-auto space-y-2 text-sm bg-slate-50 p-3 rounded border"></div>
          <div class="flex gap-2">
            <input type="text" id="chatInput" placeholder="例: ワークショップの時間を10分伸ばした構成にして" class="flex-1 border p-2 rounded text-sm">
            <button onclick="sendChatMessage()" class="bg-slate-800 text-white px-4 py-2 rounded text-sm hover:bg-slate-700">送信</button>
          </div>
        </div>
      </section>

    </div>
  </div>

  <script>
    // LocalStorage から API キー取得
    document.getElementById('apiKey').value = localStorage.getItem('GEMINI_API_KEY') || '';
    function saveApiKey() {
      localStorage.setItem('GEMINI_API_KEY', document.getElementById('apiKey').value.trim());
      alert('API Keyを保存しました。');
    }

    // ★ ナレッジ継承・黄金ルール
    const GOLDEN_RULES = `
【講義づくりの黄金ルール】
- 導入で受講者の「自分ごと化」を促す問いかけを必ず入れる。
- 知識伝達（講義）だけでなく、対話・個人ワークを交互に配置して飽きさせない。
- 専門用語は噛み砕き、具体的な事例（ケーススタディ）をセットで提示する。
- 最後のまとめでは「明日からできる1つのアクション」を持ち帰らせる。
    `;

    // ★ ペルソナ定義
    const PERSONAS = [
      { id: 'p1', title: '① 肯定・魅力発掘', role: 'この企画の強みやユニークさ、受講者に響くポイントを肯定的に抽出する評価者。' },
      { id: 'p2', title: '② 問題点・リスク指摘', role: '時間配分の無理、内容の難解さ、離脱ポイントなどの懸念点を厳しく指摘するクリティカルな分析者。' },
      { id: 'p3', title: '③ 受講者目線', role: 'ターゲット受講者のリアルな気持ちになりきり、「本当に集中が持つか」「難しくないか」「どう感じるか」を代弁する受講者。' },
      { id: 'p4', title: '④ ベテラン講師', role: '豊富な登壇実績を持ち、具体的なワーク設計、進行のコツ、受講者を惹きつけるファシリテーションのアドバイスを行う専門家。' }
    ];

    let currentSession = {
      theme: '', target: '', duration: '', goal: '',
      personaResults: {}, finalProposal: '', chatHistory: []
    };

    // 一括生成処理
    async function generateProposal() {
      const apiKey = document.getElementById('apiKey').value.trim();
      if (!apiKey) return alert('API Keyを入力してください。');

      const btn = document.getElementById('generateBtn');
      btn.disabled = true;
      btn.innerText = '分析・生成中...';

      currentSession.theme = document.getElementById('theme').value;
      currentSession.target = document.getElementById('target').value;
      currentSession.duration = document.getElementById('duration').value;
      currentSession.goal = document.getElementById('goal').value;

      const personaPromptList = PERSONAS.map(p => `- ${p.title}:${p.role}`).join('\n');

      const systemPrompt = `
あなたは優秀な講義・セミナー設計スペシャリストです。
以下の【黄金ルール】と【基本条件】に基づき、指示に従って回答を作成してください。

${GOLDEN_RULES}

【基本条件】
- テーマ: ${currentSession.theme}
- 対象者: ${currentSession.target}
- 時間: ${currentSession.duration}
- ゴール: ${currentSession.goal}

【指示】
1. 以下の4つの視点（ペルソナ）になりきり、それぞれ200文字程度で多角的分析・アドバイスを行ってください。
${personaPromptList}

2. 上記の4つの視点を統合し、【黄金ルール】を満たした「講義構成案（70%完成版）」を出力してください。時間配分、セクションごとの目的、ワーク概要を含めてください。

【重要：出力形式について】
必ず以下の構造の純粋なJSONオブジェクトのみを出力してください（Markdownの\`\`\`json などの装飾コードブロックも含めないでください）。

{
  "personas": {
    "p1": "肯定・魅力の分析内容...",
    "p2": "問題点・リスクの分析内容...",
    "p3": "受講者目線の分析内容...",
    "p4": "ベテラン講師の分析内容..."
  },
  "proposal": "統合構成案（Markdownテキスト）..."
}
      `;

      // 試行するモデル名の優先順位リスト（アナリティクスツール実績モデルを指定）
      const modelsToTry = [
        'gemini-3.8-flash'
      ];

      let lastError = null;
      let parsedData = null;

      for (const model of modelsToTry) {
        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: systemPrompt }] }]
            })
          });

          const data = await response.json();

          if (data.error) {
            throw new Error(`APIエラー [${data.error.code}]: ${data.error.message}`);
          }

          if (!data.candidates || data.candidates.length === 0) {
            throw new Error('AIからの回答が取得できませんでした。');
          }

          let resultText = data.candidates[0].content.parts[0].text.trim();
          
          // クリーニング処理
          resultText = resultText.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/i, '');
          
          parsedData = JSON.parse(resultText);
          break; // 成功したらループを抜ける

        } catch (err) {
          lastError = err;
          console.warn(`モデル ${model} でのエラー:`, err);
        }
      }

      btn.disabled = false;
      btn.innerText = '多角分析＆構成案を一括生成';

      if (!parsedData) {
        alert('生成に失敗しました:\n' + (lastError ? lastError.message : '不明なエラー'));
        return;
      }

      // 結果の描写
      currentSession.personaResults = parsedData.personas || {};
      currentSession.finalProposal = parsedData.proposal || '';
      renderResults();
    }

    // 結果のUI反映
    function renderResults() {
      const container = document.getElementById('personaOutput');
      container.innerHTML = '';

      PERSONAS.forEach(p => {
        const content = currentSession.personaResults[p.id] || '分析なし';
        const card = document.createElement('div');
        card.className = 'bg-slate-50 p-4 rounded-lg border border-slate-200 text-sm space-y-1';
        card.innerHTML = `<h4 class="font-bold text-slate-800">${p.title}</h4><p class="text-slate-600 text-xs">${content}</p>`;
        container.appendChild(card);
      });

      document.getElementById('finalProposal').innerText = currentSession.finalProposal;
    }

    // チャット送信機能
    async function sendChatMessage() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const input = document.getElementById('chatInput');
      const message = input.value.trim();
      if (!apiKey || !message) return;

      const historyDiv = document.getElementById('chatHistory');
      historyDiv.innerHTML += `<div><strong>User:</strong> ${message}</div>`;
      input.value = '';

      const prompt = `現在の構成案:\n${currentSession.finalProposal}\n\nユーザーの要望: ${message}\n上記の要望を反映して構成案を修正・アドバイスしてください。`;

      try {
        const response = await fetch(`[https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=$](https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=$){apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        const data = await response.json();
        const reply = data.candidates[0].content.parts[0].text;
        historyDiv.innerHTML += `<div class="text-indigo-900"><strong>AI:</strong> ${reply}</div>`;
        historyDiv.scrollTop = historyDiv.scrollHeight;
      } catch (e) {
        alert('チャット送信中にエラーが発生しました: ' + e.message);
      }
    }

    // JSON保存（エクスポート）
    function exportData() {
      const blob = new Blob([JSON.stringify(currentSession, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `lecture_plan_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }

    // JSON読込（インポート）
    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          currentSession = JSON.parse(e.target.result);
          document.getElementById('theme').value = currentSession.theme || '';
          document.getElementById('target').value = currentSession.target || '';
          document.getElementById('duration').value = currentSession.duration || '';
          document.getElementById('goal').value = currentSession.goal || '';
          renderResults();
          alert('データを読み込みました。');
        } catch (err) {
          alert('JSONファイルの読み込みに失敗しました。');
        }
      };
      reader.readAsText(file);
    }
  </script>
</body>
</html>
