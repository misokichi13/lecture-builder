<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>講義・セミナー構成作成＆マルチペルソナ検証ツール</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 p-4 md:p-8">

  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- ヘッダー & APIキー設定 -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">講義・セミナー構成作成ツール</h1>
        <p class="text-sm text-slate-500">マルチペルソナ検証 & ナレッジ継承システム</p>
      </div>
      <div class="flex items-center gap-2 w-full md:w-auto">
        <input type="password" id="apiKey" placeholder="Gemini API Key を入力" class="border p-2 rounded text-sm w-full md:w-64">
        <button onclick="saveApiKey()" class="bg-slate-800 text-white px-4 py-2 rounded text-sm whitespace-nowrap hover:bg-slate-700">保存</button>
      </div>
    </header>

    <!-- 入力フォーム & JSON保存・読み込み -->
    <div class="grid md:grid-cols-3 gap-6">
      
      <!-- 入力・コントロールパネル -->
      <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 md:col-span-1 space-y-4">
        <div class="flex justify-between items-center border-b pb-2">
          <h2 class="font-bold text-slate-700">1. 基本条件の入力</h2>
          <div class="space-x-1">
            <button onclick="exportData()" class="text-xs bg-emerald-100 text-emerald-800 px-2 py-1 rounded hover:bg-emerald-200">JSON保存</button>
            <label class="text-xs bg-sky-100 text-sky-800 px-2 py-1 rounded hover:bg-sky-200 cursor-pointer">
              JSON読込 <input type="file" id="importFile" onchange="importData(event)" class="hidden" accept=".json">
            </label>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold mb-1">テーマ・タイトル</label>
          <input type="text" id="theme" class="w-full border p-2 rounded text-sm" placeholder="例: 職場のアンコンシャス・バイアス研修">
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1">対象者（ペルソナ）</label>
          <input type="text" id="target" class="w-full border p-2 rounded text-sm" placeholder="例: 30〜40代の中堅社員・管理職候補">
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1">所要時間</label>
          <input type="text" id="duration" class="w-full border p-2 rounded text-sm" placeholder="例: 90分（講義60分＋ワーク30分）">
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1">ゴール（到達目標）</label>
          <textarea id="goal" class="w-full border p-2 rounded text-sm h-20" placeholder="例: 無意識の偏見に気づき、明日からのコミュニケーションで意識すべき1つの行動を決める"></textarea>
        </div>

        <!-- ⑤のみ切り替え可能な分析オプション -->
        <div class="border-t pt-3 space-y-2">
          <label class="block text-xs font-bold text-slate-700">■ 分析ペルソナ設定</label>
          <div class="p-2.5 bg-slate-50 rounded-lg border border-slate-200 space-y-2 text-xs">
            <p class="text-slate-500 text-[11px]">※①〜④の基本ペルソナ（肯定/リスク/受講者/ベテラン）は常時適用されます。</p>
            <label class="flex items-center gap-2 cursor-pointer font-semibold text-indigo-900 pt-1 border-t border-slate-200">
              <input type="checkbox" id="enableP5" class="w-4 h-4 accent-indigo-600 rounded cursor-pointer" checked>
              ⑤ 武藤視点を含める
            </label>
          </div>
        </div>

        <button onclick="generateProposal()" id="generateBtn" class="w-full bg-indigo-600 text-white py-2.5 rounded font-bold hover:bg-indigo-700 shadow-sm">
          多角分析＆構成案を一括生成
        </button>
      </section>

      <!-- 結果表示エリア -->
      <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 md:col-span-2 space-y-6">
        <h2 class="font-bold text-slate-700 border-b pb-2">2. ペルソナ分析 & 統合構成案</h2>

        <!-- ペルソナ別分析出力 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="personaOutput">
          <!-- JSでペルソナごとのカードが自動生成されます -->
        </div>

        <!-- 統合された70%構成案 -->
        <div class="bg-slate-50 p-4 rounded-lg border border-slate-200">
          <h3 class="font-bold text-indigo-900 mb-2">【統合構成案（70%完成版）】</h3>
          <div id="finalProposal" class="whitespace-pre-wrap text-sm text-slate-700">ここに生成結果が表示されます。</div>
        </div>

        <!-- 深掘りチャット -->
        <div class="border-t pt-4 space-y-3">
          <h3 class="font-bold text-slate-700 text-sm">3. 継続対話（構成案の修正・深掘り）</h3>
          <div id="chatHistory" class="max-h-40 overflow-y-auto space-y-2 text-sm bg-slate-50 p-3 rounded border"></div>
          <div class="flex gap-2">
            <input type="text" id="chatInput" placeholder="例: ワークショップの時間を10分伸ばした構成にして" class="flex-1 border p-2 rounded text-sm" onkeydown="if(event.key==='Enter') sendChatMessage()">
            <button onclick="sendChatMessage()" class="bg-slate-800 text-white px-4 py-2 rounded text-sm hover:bg-slate-700">送信</button>
          </div>
        </div>
      </section>

    </div>
  </div>

  <script>
    // LocalStorage から API キー取得
    document.getElementById('apiKey').value = localStorage.getItem('GEMINI_API_KEY') || '';
    function saveApiKey() {
      localStorage.setItem('GEMINI_API_KEY', document.getElementById('apiKey').value.trim());
      alert('API Keyを保存しました。');
    }

    // ナレッジ継承・黄金ルール
    const GOLDEN_RULES = `
【講義づくりの黄金ルール】
- 導入で受講者の「自分ごと化」を促す問いかけを必ず入れる。
- 知識伝達（講義）だけでなく、対話・個人ワークを交互に配置して飽きさせない。
- 専門用語は噛み砕き、具体的な事例（ケーススタディ）をセットで提示する。
- 最後のまとめでは「明日からできる1つのアクション」を持ち帰らせる。
    `;

    // 定義済みペルソナリスト
    const BASE_PERSONAS = [
      { id: 'p1', title: '① 肯定・魅力発掘', role: 'この企画の強みやユニークさ、受講者に響くポイントを肯定的に抽出する評価者。' },
      { id: 'p2', title: '② 問題点・リスク指摘', role: '時間配分の無理、内容の難解さ、離脱ポイントなどの懸念点を厳しく指摘するクリティカルな分析者。' },
      { id: 'p3', title: '③ 受講者目線', role: 'ターゲット受講者のリアルな気持ちになりきり、「本当に集中が持つか」「難しくないか」「どう感じるか」を代弁する受講者。' },
      { id: 'p4', title: '④ ベテラン講師', role: '豊富な登壇実績を持ち、具体的なワーク設計、進行のコツ、受講者を惹きつけるファシリテーションのアドバイスを行う専門家。' }
    ];

    const PERSONA_P5 = {
      id: 'p5',
      title: '⑤ 武藤視点',
      role: `男女共同参画センターの現場担当者として検証します。単なる知識伝達やノウハウの提示で終わらせず、受講者が「社会の思い込み（ジェンダー規範）」に気づき、「自分ごと」として受け止められる構成になっているかを以下の現場知見に基づいて評価・助言してください。

【重視する検証ポイント】
1. 「個人」から「社会の構造」への接続：
   個人の捉え方や事例に留めず、「なぜそう思うのか？どんな社会の思い込みが隠れているか？」という本質・背景（構造）へ戻す解説・問いかけの仕掛けがあるか。受講者を責めず「誰もが社会の影響を受けている」という共感ベースの配慮がされているか。
2. 飽きさせない90分構成（30分講義/30分ワーク/30分解説・まとめ 等）：
   座学が長くなって集中が切れないよう、講義の合間に適切なタイミングでワークが挟み込まれ、展開にリズムがあるか。
3. 萎縮させないワーク設計：
   正解を求めるのではなく「どう感じるか」というオープンなお題になっているか。発表のハードルが高すぎず、出た意見を肯定的に受け止めながら全体へ話を広げられる工夫（マイクフォローや問い直しの余白）があるか。`
    };

    let currentSession = {
      theme: '', target: '', duration: '', goal: '',
      personaResults: {}, finalProposal: '', chatHistory: []
    };

    // 画面表示レンダリング関数
    function renderResults() {
      const outputDiv = document.getElementById('personaOutput');
      outputDiv.innerHTML = '';

      const allPersonas = [...BASE_PERSONAS, PERSONA_P5];

      Object.keys(currentSession.personaResults).forEach(pId => {
        const persona = allPersonas.find(p => p.id === pId);
        if (!persona) return;

        const card = document.createElement('div');
        card.className = 'bg-slate-50 p-3 rounded-lg border border-slate-200 text-xs space-y-1';
        card.innerHTML = `
          <h4 class="font-bold text-indigo-900 border-b pb-1">${persona.title}</h4>
          <p class="text-slate-700 whitespace-pre-wrap leading-relaxed">${currentSession.personaResults[pId]}</p>
        `;
        outputDiv.appendChild(card);
      });

      document.getElementById('finalProposal').innerText = currentSession.finalProposal || 'ここに生成結果が表示されます。';
    }

    // 最新モデルを使用
    const MODEL_NAME = 'gemini-3.8-flash';

    // APIを呼び出す関数（自動リトライ付き）
    async function fetchWithRetry(apiKey, promptText, maxAttempts = 4) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKey}`;
      
      for (let attempt = 1; attempt <= maxAttempts; attempt++) {
        try {
          const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: promptText }] }]
            })
          });

          const data = await response.json();

          if (data.error) {
            // 503混雑エラー、またはリクエスト過多(429)の場合のみ再試行
            if (data.error.code === 503 || response.status === 503 || data.error.code === 429) {
              const waitTime = attempt * 3000; // 3秒、6秒、9秒... と徐々に待機時間を延ばす
              const btn = document.getElementById('generateBtn');
              if (btn) btn.innerText = `混雑中... 再試行(${attempt}/${maxAttempts})${waitTime/1000}秒待機`;
              await new Promise(r => setTimeout(r, waitTime));
              continue;
            }
            throw new Error(`APIエラー [${data.error.code}]:${data.error.message}`);
          }

          if (data.candidates && data.candidates.length > 0) {
            return data.candidates[0].content.parts[0].text.trim();
          }
          throw new Error('AIからの回答が取得できませんでした。');

        } catch (err) {
          if (attempt === maxAttempts) throw err;
          await new Promise(r => setTimeout(r, 2000));
        }
      }
      throw new Error('サーバー混雑が続いています。時間を置いて再度お試しください。');
    }

    // 一括生成処理
    async function generateProposal() {
      const apiKey = document.getElementById('apiKey').value.trim();
      if (!apiKey) return alert('API Keyを入力してください。');

      const btn = document.getElementById('generateBtn');
      btn.disabled = true;
      btn.innerText = '分析・生成中...';

      currentSession.theme = document.getElementById('theme').value;
      currentSession.target = document.getElementById('target').value;
      currentSession.duration = document.getElementById('duration').value;
      currentSession.goal = document.getElementById('goal').value;

      // ①〜④は確定、⑤のチェックボックス状態を判定
      const isP5Enabled = document.getElementById('enableP5').checked;
      const activePersonas = [...BASE_PERSONAS];
      if (isP5Enabled) {
        activePersonas.push(PERSONA_P5);
      }

      const personaPromptList = activePersonas.map(p => `- ${p.id} (${p.title}):${p.role}`).join('\n');
      const jsonPersonaStructure = activePersonas.map(p => `    "${p.id}": "${p.title}の分析内容..."`).join(',\n');

      const systemPrompt = `
あなたは優秀な講義・セミナー設計スペシャリストです。
以下の【黄金ルール】と【基本条件】に基づき、指示に従って回答を作成してください。

${GOLDEN_RULES}

【基本条件】
- テーマ: ${currentSession.theme}
- 対象者: ${currentSession.target}
- 時間: ${currentSession.duration}
- ゴール: ${currentSession.goal}

【指示】
1. 以下の視点（ペルソナ）になりきり、それぞれ100〜150文字程度で簡潔に分析・アドバイスを行ってください。
${personaPromptList}

2. 上記の視点を統合し、【黄金ルール】を満たした「講義構成案（70%完成版）」を出力してください。時間配分、セクションごとの目的、ワーク概要を含めてください。

【重要：出力形式について】
必ず以下の構造の純粋なJSONオブジェクトのみを出力してください（Markdownの\`\`\`json などの装飾コードブロックも含めないでください）。

{
  "personas": {
${jsonPersonaStructure}
  },
  "proposal": "統合構成案（Markdownテキスト）..."
}
      `;

      try {
        const rawText = await fetchWithRetry(apiKey, systemPrompt);
        const cleanText = rawText.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/i, '');
        const parsedData = JSON.parse(cleanText);

        currentSession.personaResults = parsedData.personas || {};
        currentSession.finalProposal = parsedData.proposal || '';
        renderResults();

      } catch (err) {
        alert(err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = '多角分析＆構成案を一括生成';
      }
    }

// チャット送信機能（自動リトライ＆エラー詳細表示付き）
    async function sendChatMessage() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const input = document.getElementById('chatInput');
      const message = input.value.trim();
      if (!apiKey || !message) return;

      const historyDiv = document.getElementById('chatHistory');
      
      // ユーザーの発言を表示
      const userMsgDiv = document.createElement('div');
      userMsgDiv.className = 'text-slate-800 font-medium';
      userMsgDiv.innerHTML = `<strong>User:</strong> ${escapeHtml(message)}`;
      historyDiv.appendChild(userMsgDiv);
      
      input.value = '';
      historyDiv.scrollTop = historyDiv.scrollHeight;

      // 処理中表示
      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'text-slate-400 italic text-xs';
      loadingDiv.innerText = 'AIが考え中...';
      historyDiv.appendChild(loadingDiv);
      historyDiv.scrollTop = historyDiv.scrollHeight;

      const prompt = `現在の構成案:\n${currentSession.finalProposal}\n\nユーザーの要望: ${message}\n上記の要望を反映して構成案を修正・アドバイスしてください。`;

      try {
        // fetchWithRetry を使って混雑時も自動再試行する
        const reply = await fetchWithRetry(apiKey, prompt, 4);
        
        loadingDiv.remove(); // ローディング消去
        
        const aiMsgDiv = document.createElement('div');
        aiMsgDiv.className = 'text-indigo-900 bg-indigo-50/50 p-2 rounded border border-indigo-100 whitespace-pre-wrap';
        aiMsgDiv.innerHTML = `<strong>AI:</strong>\n${escapeHtml(reply)}`;
        historyDiv.appendChild(aiMsgDiv);
        
        // 履歴をセッションに保存
        currentSession.chatHistory.push({ role: 'user', text: message });
        currentSession.chatHistory.push({ role: 'ai', text: reply });

      } catch (e) {
        loadingDiv.remove();
        const errDiv = document.createElement('div');
        errDiv.className = 'text-rose-600 bg-rose-50 p-2 rounded border border-rose-200 text-xs';
        errDiv.innerHTML = `<strong>エラー:</strong> ${escapeHtml(e.message)}`;
        historyDiv.appendChild(errDiv);
      }
      
      historyDiv.scrollTop = historyDiv.scrollHeight;
    }

    // エスケープ処理（安全のため）
    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // JSON保存
    function exportData() {
      const blob = new Blob([JSON.stringify(currentSession, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `lecture_plan_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }

    // JSON読込
    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          currentSession = JSON.parse(e.target.result);
          document.getElementById('theme').value = currentSession.theme || '';
          document.getElementById('target').value = currentSession.target || '';
          document.getElementById('duration').value = currentSession.duration || '';
          document.getElementById('goal').value = currentSession.goal || '';
          renderResults();
          alert('データを読み込みました。');
        } catch (err) {
          alert('JSONファイルの読み込みに失敗しました。');
        }
      };
      reader.readAsText(file);
    }
  </script>
</body>
</html>
